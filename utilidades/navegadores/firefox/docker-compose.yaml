#  Servicio navegador Firefox
services:
  firefox:
    container_name: utilidades-navegador-firefox
    image: lscr.io/linuxserver/firefox:latest
    restart: unless-stopped
    volumes:
      - ./config:/config
    ports:
      - 3000:3000           # Puerto para la interfaz web de Firefox
      - 3001:3001
    shm_size: "1gb"
    env_file:
      - /volume1/docker/docker/synology.env                     # variables synology (PUID, PGID, TZ)

# usar con el proxy inverso de synology para acceder a la interfaz web de Firefox desde el navegador en https